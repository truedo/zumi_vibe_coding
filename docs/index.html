<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 기존 CSS 스타일 유지 */
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --accent-orange: #f97316;

            --theme-class: #7c3aed;
            --theme-scratch: #fbbf24;
            --theme-entry: #10b981;
            --theme-python: #3b82f6;
            --theme-ai: #1e3a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            transition: background 0.4s ease, background-image 0.4s ease;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            padding-top: 0;
        }

        main {
            max-width: 1200px;
            padding: 0 1rem;
            margin: 1rem auto;
        }

        .category-block {
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            border-left: 6px solid var(--border);
        }

        .category-header {
            transition: all 0.3s ease;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed var(--border);
        }

        .category-header h2 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 0.75rem;
        }

        .card {
            border: 1px solid var(--border);
            border-top: 4px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            padding: 0.75rem;
            min-height: auto;
            gap: 8px;
            border-radius: 6px;
            overflow: hidden;
            background: #ffffff;
            text-decoration: none;
            /* JS에서 부여하는 대신 CSS에 추가 */
            color: inherit;
        }

        .card:hover {
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .card-main-text {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-main-text h3 {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem !important;
            line-height: 1.25;
        }

        .card-desc {
            font-size: 0.78rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            max-width: 100%;
            /* color: #a0a0a0; */
            color: #6d6c6c;
        }



        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            /* 제목 아래 여백 */
            /* padding-bottom: 0.5rem; */
            /* 제목 안쪽 여백 */
            /* border-bottom: 2px solid var(--border); */
            /* 제목 아래 구분선 */
        }








        /* ── HERO ── */
        .hero {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 24px 80px;
            text-align: center;
        }

        .hero-eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: .72rem;
            letter-spacing: 5px;
            color: var(--accent);
            margin-bottom: 32px;
            opacity: .8;
        }

        .hero-eyebrow2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            letter-spacing: 5px;
            color: var(--accent);
            /* margin-bottom: 32px; */
            margin-bottom: 0px;
            opacity: .8;
        }

        /* 핵심 슬로건 */
        .hero-slogan {
            font-family: 'Orbitron', monospace;
            font-size: clamp(3rem, 5vw, 3rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }

        .hs-set {
            background: linear-gradient(135deg, #eb7f7f 0%, #a5b4fc 60%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }

        .hs-time {
            background: linear-gradient(135deg, #6183f1 0%, #51b9e9 60%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hs-word {
            background: linear-gradient(135deg, #7272e7, #37e975);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }

        .hero-sub-slogan {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: clamp(.9rem, 2vw, 1.1rem);
            color: var(--dim);
            margin-bottom: 48px;
            line-height: 1.8;
        }

        .hero-sub-slogan strong {
            color: var(--text);
        }

        /* ── 섹션 공통 ── */
        .section {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 24px;
        }




        .card-thumbnail {
            position: relative;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: #000;
            margin-bottom: 8px;
        }

        .card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            pointer-events: none;
        }



        .hero-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 48px;
            flex-wrap: wrap;
            text-align: left;
        }

        .hero-text {
            text-align: left;
        }

        .logo {
            flex-shrink: 0;
        }

        .logo img {
            max-width: 360px;
            width: 100%;
            height: auto;
        }


        .category-desc {
            font-size: 0.85rem;
            /* color: var(--text-muted);*/
            color: var(--theme-python);
            margin-top: 4px;
        }

        /* ── 모바일 대응 ── */
        @media (max-width: 640px) {
            main {
                padding: 0 0.75rem;
                margin: 0.75rem auto;
            }

            .hero {
                min-height: auto;
                padding: 24px 12px 40px;
            }

            .hero-top {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .hero-text {
                text-align: center;
            }

            .logo img {
                max-width: 220px;
            }

            .hero-eyebrow2 {
                font-size: 1rem;
                letter-spacing: 2px;
            }

            .hero-slogan {
                font-size: clamp(1.6rem, 7vw, 2.2rem);
                letter-spacing: -1px;
            }

            .page-title {
                font-size: 1.3rem;
            }

            .category-block {
                padding: 0.85rem 1rem;
                margin-bottom: 1rem;
            }

            .category-header h2 {
                font-size: 1rem;
            }

            .grid-layout {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.6rem;
            }

            .card {
                padding: 0.6rem;
            }

            .card-main-text h3 {
                font-size: 0.8rem !important;
            }

            .card-desc {
                font-size: 0.72rem;
            }
        }

        @media (max-width: 400px) {
            .grid-layout {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <!-- <main id="card-container"></main> -->

    <!-- <div class="logo">
                <img id="img-logo" src="zumi-ai-logo.png" alt="Zumi AI">
        </div> -->

    <main>

        <div class="hero-top">


            <div class="logo">
                <a href="https://zumi-ai.github.io/python/website/zumi_ai_e_manual.html" target="_blank">
                    <img id="img-logo" src="zumi-ai-logo.png" alt="Zumi AI">
                </a>
            </div>

            <div class="hero-text">
                <div class="hero-eyebrow2">
                    <span class="hs-set">주미 AI 와 함께 바이브코딩으로 </span>
                </div>

                <h1 class="hero-slogan">
                    <span class="hs-time">5분 만에 프로젝트 만들기</span>
                    <!-- <span class="hs-word">스트리밍</span> -->
                </h1>

                <!-- <p class="hero-sub-slogan">
                    코드를 외우지 않아도 됩니다.
                    <strong>AI에게 말하면</strong>, 로봇이 움직입니다.
                </p> -->
            </div>


        </div>



        <!-- <h1 class="page-title">여기에 페이지 제목을 입력하세요</h1> -->
        <div id="card-container"></div>

    </main>

    <!-- 자바스크립트가 카드를 생성해서 넣을 전용 컨테이너 -->
    <!-- <div id="card-container"></div> -->


    <script>
        // 1. 컨테이너와 아이템 데이터를 정의합니다.
        const pageData = [

            {
                title: "바이브 코딩 가이드",
                desc: "어려운 연결부터 AI 활용 방법까지 <br>바이브 코딩의 기본 과정을 쉽게 알려드립니다..",
                containerTheme: "var(--theme-entry)",
                items: [

                    { title: "와이파이 연결하기", desc: "와이파이 연결 방법", link: "https://youtu.be/hiZbEPbYNSA", itemTheme: "var(--theme-ai)", thumbnail: "hiZbEPbYNSA" },
                    { title: "바이브 코딩 방법", desc: "바이브 코딩 방법", link: "https://youtu.be/0xz4vlcDZOY", itemTheme: "var(--theme-ai)", thumbnail: "9IDGBR16i_0" },
                    // { title: "3. 개념 가이드", desc: "나만의 AI 로봇<br>프로젝트 만들기", link: "zumi_advanced_intro.html", itemTheme: "var(--theme-class)" },

                    // { title: "4 AI 연결하기", desc: "와이파이 연결하기", link: "zumi_advanced_intro.html", itemTheme: "var(--theme-ai)", image: "wireless_1.png" },
                    // { title: "새로운 아이템 1", desc: "설명 1", link: "#", itemTheme: "var(--theme-python)" },
                    // { title: "새로운 아이템 2", desc: "설명 2", link: "#", itemTheme: "var(--theme-scratch)" }
                ]
            },


            {
                title: "1. 처음 다루는 바이브 코딩",
                desc: "코딩이나 로봇이 처음이라면 여기부터 시작하세요.<br><br>- 로봇, 코딩, 하드웨어가 낯선 사람<br>- 기술 설명보다 결과 중심<br>- 준비된 프롬프트로 따라 하기",

                containerTheme: "var(--theme-class)",
                items: [
                    { title: "바로 따라해보기", desc: "따라하면 5분 안에<br>로봇 카메라 화면", link: "zumi_easy_intro.html", itemTheme: "var(--theme-class)", image: "vibe_easy_00.png" },
                    { title: "1. 연결하고 보기", desc: "로봇과 연결하고<br>카메라 화면을 확인", link: "zumi_easy_step1.html", itemTheme: "var(--theme-entry)", image: "vibe_easy_01.png" },
                    { title: "2. 표현 하기", desc: "로봇에게<br>개성부여", link: "zumi_easy_step2.html", itemTheme: "var(--theme-scratch)", image: "vibe_easy_02.png" },
                    { title: "3. 움직이기", desc: "움직여보기", link: "zumi_easy_step3.html", itemTheme: "var(--theme-python)", image: "vibe_easy_03.png" },
                    { title: "4. AI 비전", desc: "AI로 인식하기", link: "zumi_easy_step4.html", itemTheme: "var(--theme-ai)", image: "vibe_easy_04.png" },
                ]
            },
            {
                title: "2. 확장하는 바이브 코딩",
                desc: "프롬프트와 기능 구조를 이해하며 확장해 보세요.<br><br>- 로봇 기능, 코딩 구조를 조금 더 이해하고 싶은 사람<br>- 프롬프트, API, 기능 구조까지 확인<br>- 원하는 기능을 더 구체적으로 설계",
                containerTheme: "var(--theme-scratch)",
                items: [
                    // { title: "도전 가이드", desc: "나만의 AI 로봇<br>프로젝트 만들기", link: "zumi_advanced_intro.html", itemTheme: "var(--theme-class)" , image: "vibe_advanced_00.png" },
                    { title: "1. 연결하고 보기", desc: "주미 AI와 연결하고<br>카메라 화면을 띄워보기", link: "zumi_advanced_step1.html", itemTheme: "var(--theme-entry)", image: "vibe_advanced_01.png" },
                    { title: "2. 표현 하기", desc: "화면과 소리를 표현하고<br> 버튼과 센서 반응하기", link: "zumi_advanced_step2.html", itemTheme: "var(--theme-scratch)", image: "vibe_advanced_02.png" },
                    { title: "3. 움직이기", desc: "주행부터 <br>자율 이동까지", link: "zumi_advanced_step3.html", itemTheme: "var(--theme-python)", image: "vibe_advanced_03.png" },
                    { title: "4. AI 비전", desc: "얼굴, 손, 물체를 인식하고<br>반응하기", link: "zumi_advanced_step4.html", itemTheme: "var(--theme-ai)", image: "vibe_advanced_04.png" },
                    { title: "[최종 통합 작업실]", desc: "모든 핵심 기능을<br> 한 번에 실행하고 완성", link: "zumi_advanced_all.html", itemTheme: "var(--theme-class)", image: "vibe_advanced_00.png" },

                ]
            },


        ];

        // 2. 데이터를 바탕으로 HTML을 렌더링하는 함수
        function renderContent() {
            //  const mainContent = document.getElementById('main-content');
            const cardContainer = document.getElementById('card-container');
            pageData.forEach(category => {
                // Section (카테고리 블록) 생성
                const section = document.createElement('section');
                section.className = 'category-block';
                section.style.borderTop = `3px solid ${category.containerTheme}`;
                section.style.borderLeft = `5px solid ${category.containerTheme}`;

                // 카테고리 헤더 생성

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `
                    <h2 style="display: inline-flex; align-items: center; gap: 10px; width: 100%;">${category.title}</h2>
                    ${category.desc ? `<p class="category-desc">${category.desc}</p>` : ''}
                `;


                // Grid Layout 생성
                const gridLayout = document.createElement('div');
                gridLayout.className = 'grid-layout';

                // 카드 아이템 생성 및 Grid Layout에 추가
                category.items.forEach(item => {
                    const card = document.createElement('a');
                    card.href = item.link;
                    card.className = 'card';
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    card.style.display = 'block';
                    card.style.borderTopColor = item.itemTheme;

                    card.innerHTML = `
                        ${item.thumbnail ? `
                        <div class="card-thumbnail">
                            <img src="https://img.youtube.com/vi/${item.thumbnail}/hqdefault.jpg" alt="${item.title}">
                            <div class="play-icon">▶</div>
                        </div>` : ''}
                        ${item.image ? `
                        <div class="card-thumbnail">
                            <img src="${item.image}" alt="${item.title}">
                        </div>` : ''}
                        <div class="card-body-wrapper">
                            <div class="card-main-text">
                                <h3>${item.title}</h3>
                                <p class="card-desc">${item.desc}</p>
                            </div>
                        </div>
                    `;
                    gridLayout.appendChild(card);
                });

                // 조립
                section.appendChild(header);
                section.appendChild(gridLayout);
                cardContainer.appendChild(section);
            });
        }

        // 페이지가 로드될 때 렌더링 실행
        document.addEventListener('DOMContentLoaded', renderContent);
    </script>
</body>

</html>
