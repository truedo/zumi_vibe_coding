<!DOCTYPE html>
<html lang="ko">
<head>
    <style>
        /* 기존 CSS 스타일 유지 */
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --accent-orange: #f97316;

            --theme-class: #7c3aed;
            --theme-scratch: #fbbf24;
            --theme-entry: #10b981;
            --theme-python: #3b82f6;
            --theme-ai: #1e3a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            transition: background 0.4s ease, background-image 0.4s ease;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            padding-top: 0;
        }

        main {
            max-width: 1200px;
            padding: 0 1rem;
            margin: 1rem auto;
        }

        .category-block {
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            border-left: 6px solid var(--border);
        }

        .category-header {
            transition: all 0.3s ease;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed var(--border);
        }

        .category-header h2 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 0.75rem;
        }

        .card {
            border: 1px solid var(--border);
            border-top: 4px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            padding: 0.75rem;
            min-height: auto;
            gap: 8px;
            border-radius: 6px;
            overflow: hidden;
            background: #ffffff;
            text-decoration: none; /* JS에서 부여하는 대신 CSS에 추가 */
            color: inherit;
        }

        .card:hover {
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .card-main-text {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-main-text h3 {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem !important;
            line-height: 1.25;
        }

        .card-desc {
            font-size: 0.78rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            max-width: 100%;
            color: #a0a0a0;
        }
    </style>
</head>

<body>
    <!-- 내용이 비워진 main 태그. 스크립트가 여기를 채웁니다. -->
    <main id="main-content"></main>

    <script>
        // 1. 컨테이너와 아이템 데이터를 정의합니다.
        const pageData = [
            {
                title: "바이브 코딩 따라하기",
                containerTheme: "var(--theme-class)",
                items: [
                    { title: "기초0 <br>바로 해보기", desc: "기초0 <br>설명0", link: "https://url_0", itemTheme: "var(--theme-class)" },
                    { title: "기초 1<br>연결 하고 보기", desc: "기초1 <br>설명1", link: "https://url_1", itemTheme: "var(--theme-entry)" },
                    { title: "기초 2<br>표현 보기", desc: "기초2 <br>설명2", link: "https://url_2", itemTheme: "var(--theme-scratch)" },
                    { title: "기초 3<br>움직이기", desc: "기초3 <br>설명3", link: "https://url_3", itemTheme: "var(--theme-python)" },
                    { title: "기초 4<br>AI 연결하기", desc: "기초4 <br>설명4", link: "https://url_4", itemTheme: "var(--theme-ai)" }
                ]
            },


            {
                title: "새로운 카테고리",
                containerTheme: "var(--theme-entry)",
                items: [
                    { title: "새로운 아이템 1", desc: "설명 1", link: "#", itemTheme: "var(--theme-python)" },
                    { title: "새로운 아이템 2", desc: "설명 2", link: "#", itemTheme: "var(--theme-scratch)" }
                ]
            },


            {
                title: "새로운 카테고리2",
                containerTheme: "var(--theme-entry)",
                items: [
                    { title: "새로운 아이템 1", desc: "설명 1", link: "#", itemTheme: "var(--theme-python)" },
                    { title: "새로운 아이템 2", desc: "설명 2", link: "#", itemTheme: "var(--theme-scratch)" }
                ]
            },



        ];

        // 2. 데이터를 바탕으로 HTML을 렌더링하는 함수
        function renderContent() {
            const mainContent = document.getElementById('main-content');

            pageData.forEach(category => {
                // Section (카테고리 블록) 생성
                const section = document.createElement('section');
                section.className = 'category-block';
                section.style.borderTop = `3px solid ${category.containerTheme}`;

                // 카테고리 헤더 생성
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `<h2 style="display: inline-flex; align-items: center; gap: 10px; width: 100%;">${category.title}</h2>`;

                // Grid Layout 생성
                const gridLayout = document.createElement('div');
                gridLayout.className = 'grid-layout';

                // 카드 아이템 생성 및 Grid Layout에 추가
                category.items.forEach(item => {
                    const card = document.createElement('a');
                    card.href = item.link;
                    card.className = 'card';
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    card.style.display = 'block';
                    card.style.borderTopColor = item.itemTheme;

                    card.innerHTML = `
                        <div class="card-body-wrapper">
                            <div class="card-main-text">
                                <h3>${item.title}</h3>
                                <p class="card-desc">${item.desc}</p>
                            </div>
                        </div>
                    `;
                    gridLayout.appendChild(card);
                });

                // 조립
                section.appendChild(header);
                section.appendChild(gridLayout);
                mainContent.appendChild(section);
            });
        }

        // 페이지가 로드될 때 렌더링 실행
        document.addEventListener('DOMContentLoaded', renderContent);
    </script>
</body>
</html>
